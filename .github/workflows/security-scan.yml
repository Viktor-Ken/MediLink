name: Security scan

# DAST (OWASP ZAP) + dependency audit against a real, seeded instance of the
# app. Runs on every push/PR to main and nightly; the active (attacking) scan
# only runs on-demand or on a schedule so it never blocks a PR by default.
#
# Everything here runs against an ephemeral database seeded with demo data
# (SEED_DEMO=1) inside the job's own container network — never point this at
# a real deployment with real patient data.
#
# ZAP runs via the official Docker image directly (not the zaproxy/action-*
# GitHub Actions): those composite actions' own internal artifact-upload step
# failed in CI with "Create Artifact Container failed" regardless of what we
# passed them — most likely because that pinned action version still calls
# GitHub's old, since-retired artifact upload API. Running the image
# ourselves sidesteps that, and matches exactly the local command documented
# in SECURITY-TESTING.md, so CI and a local run behave the same way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # nightly, includes the active scan
  workflow_dispatch:
    inputs:
      active_scan:
        description: 'Also run the ZAP active (attacking) scan'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails the build on a HIGH/CRITICAL advisory with a fix available, but
      # not on everything, so the job stays useful signal rather than noise.
      # Remove --audit-level to be stricter. This step used to carry
      # continue-on-error: true, which meant npm audit could never actually
      # block a PR regardless of what it found — make it a required check in
      # branch protection once the team has triaged a few real runs.
      - name: Audit server dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  dast-zap:
    name: OWASP ZAP scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hospital
      NODE_ENV: development # intentional: loads throwaway demo accounts/PINs for the scan to log in with
      SEED_DEMO: '1'
      JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-not-for-reuse-please-pad-to-32-chars
      PORT: 4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Install & build web client
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run DB migration (seeded demo data)
        working-directory: server
        run: npm run db:migrate

      - name: Start API (serves the built web client too)
        working-directory: server
        run: |
          nohup npm start > /tmp/medilink-server.log 2>&1 &
          echo "Waiting for http://127.0.0.1:4000/api/health ..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null 2>&1; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time."
          cat /tmp/medilink-server.log
          exit 1

      # --network host: the GitHub-hosted runner is Linux, so the container
      # reaches the app (running directly on the runner, not in a container)
      # at 127.0.0.1:4000 only if it shares the runner's network namespace.
      # --user root: zap-stable's default non-root user can't write into the
      # bind-mounted .zap/ directory with the runner's host UID otherwise.
      # The image tag is unpinned (zap-stable tracks ZAP's latest stable
      # release, same as the local command in SECURITY-TESTING.md) — this
      # sandbox has no network access to verify a specific digest to pin to.
      - name: ZAP baseline scan (passive — safe to run on every PR)
        run: |
          docker run --rm --network host --user root \
            -v "$PWD/.zap:/zap/wrk/:rw" \
            -t zaproxy/zap-stable zap-baseline.py \
            -t http://127.0.0.1:4000/ -a \
            -c rules.tsv \
            -r report_html.html -w report_md.md -J report_json.json \
          || echo "::warning::ZAP baseline scan reported alerts (non-zero exit) — see the uploaded report artifact"

      - name: Upload ZAP baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            .zap/report_html.html
            .zap/report_md.md
            .zap/report_json.json
          if-no-files-found: warn
          retention-days: 30

      - name: ZAP full (active) scan — nightly or on-demand only
        if: github.event_name == 'schedule' || inputs.active_scan == true
        run: |
          docker run --rm --network host --user root \
            -v "$PWD/.zap:/zap/wrk/:rw" \
            -t zaproxy/zap-stable zap-full-scan.py \
            -t http://127.0.0.1:4000/ -a \
            -c rules.tsv \
            -r report_html.html -w report_md.md -J report_json.json \
          || echo "::warning::ZAP full scan reported alerts (non-zero exit) — see the uploaded report artifact"

      - name: Upload ZAP full-scan report
        if: github.event_name == 'schedule' || inputs.active_scan == true
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-report
          path: |
            .zap/report_html.html
            .zap/report_md.md
            .zap/report_json.json
          if-no-files-found: warn
          retention-days: 30

      - name: Server log (always, for debugging)
        if: always()
        run: cat /tmp/medilink-server.log || true
